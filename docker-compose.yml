version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: cvcover_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cvcover_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=cvcover_db
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_cvcover_optimizer_super_safe_2026}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-gemini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/exports:/app/exports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cvcover_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mongodb_data:
